<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nicholas Sevē</title>
  <meta name="description" content="Paintings by Nicholas Sevē.">

  <style>
    :root {
      --bg: #fff;
      --text: #222;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 4vw;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 5;
    }

    .name {
      font-size: 14px;
    }

    nav {
      display: flex;
      gap: 20px;
      font-size: 13px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* MAIN */

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 2vw 4vw 10vw;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7vw 3vw;
    }

    figure {
      margin: 0;
      cursor: pointer;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: #ddd;
    }

    figcaption {
      padding-top: 10px;
      font-size: 12px;
    }

    .meta {
      color: var(--muted);
      margin-top: 2px;
      font-size: 12px;
    }

    /* DRAWINGS */

    #drawings {
      margin-top: 16vw;
    }

    #drawings > h1 {
      font-size: 18px;
      font-weight: 400;
      margin: 0 0 30px;
    }

    /* CONTACT */

    .contact {
      border-top: 1px solid #ccc;
      padding: 25px 0 0;
      margin-top: 16vw;
    }

    .contact h2 {
      font-size: 14px;
      font-weight: 400;
      margin: 0 0 15px;
    }

    .email-button {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #222;
      background: #fff;
      color: #222;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .email-button:hover {
      background: #f2f2f2;
    }

    .email-link {
      color: inherit;
      font-size: 13px;
    }

    /* FOOTER */

    footer {
      padding: 8vw 4vw 30px;
      color: var(--muted);
      font-size: 11px;
    }

    /* LIGHTBOX */

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, .94);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 4vw;
    }

    #lightbox.open {
      display: flex;
    }

    #lightbox img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
    }

    #close {
      position: absolute;
      top: 24px;
      right: 30px;
      color: white;
      background: none;
      border: 0;
      font-size: 28px;
      cursor: pointer;
      font-weight: 200;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 20px 5vw;
      }

      nav {
        gap: 14px;
      }

      main {
        padding: 0 5vw 15vw;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 14vw;
      }

      #drawings {
        margin-top: 25vw;
      }

      .contact {
        margin-top: 25vw;
      }

      footer {
        padding: 8vw 5vw 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="name">Nicholas Sevē</div>

  <nav>

<footer>
  © 2026 Nicholas Sevē
</footer>


<!-- LIGHTBOX -->

<div id="lightbox" aria-hidden="true">

  <button id="close" aria-label="Close">×</button>

  <img id="lightbox-img" src="" alt="">

</div>


<script>

  /* EMAIL */

  document.getElementById("email-button").addEventListener("click", function () {

    const email =
      atob("bmlj") +
      atob("c2V2ZTE=") +
      atob("K3BvcnQ=") +
      atob("QGdt") +
      atob("YWls") +
      atob("LmNvbQ==");

    const link = document.createElement("a");

    link.href = "mailto:" + email;
    link.textContent = email;
    link.className = "email-link";

    document.getElementById("email").appendChild(link);

    this.style.display = "none";

  });


  /* LIGHTBOX */

  const box = document.getElementById("lightbox");
  const boxImg = document.getElementById("lightbox-img");

  document.querySelectorAll("figure img").forEach(img => {

    img.addEventListener("click", () => {

      boxImg.src = img.src;
      boxImg.alt = img.alt;

      box.classList.add("open");
      box.setAttribute("aria-hidden", "false");

    });

  });


  function closeBox() {

    box.classList.remove("open");
    box.setAttribute("aria-hidden", "true");
    boxImg.src = "";

  }


  document.getElementById("close")
    .addEventListener("click", closeBox);


  box.addEventListener("click", e => {

    if (e.target === box) {
      closeBox();
    }

  });


  document.addEventListener("keydown", e => {

    if (e.key === "Escape") {
      closeBox();
    }

  });

</script>

</html>
